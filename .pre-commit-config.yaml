# ═══════════════════════════════════════════════════════════════════════
# Pre-commit hooks — llm-agent
# Рекомендация 4 из технического анализа (Sprint 2, P1)
# ═══════════════════════════════════════════════════════════════════════
#
# Установка:
#   pip install pre-commit
#   pre-commit install           # ставит git hook в .git/hooks/pre-commit
#   pre-commit install --hook-type pre-push  # + hook перед push
#   pre-commit run --all-files   # ручной прогон по всем файлам
#
# Что проверяет:
#   1. Базовые fixes (trailing-whitespace, end-of-file-fixer, check-yaml, check-merge-conflict)
#   2. ruff — линтер и форматтер (заменяет flake8 + black + isort)
#   3. bandit — security-сканер Python-кода
#   4. pip-audit — проверка уязвимостей в зависимостях
#   5. check-large-files — защита от коммита бинарников >500 КБ
#   6. forbid-new-noqa — запрет добавлять новые # noqa (есть 106, не плодим)
# ═══════════════════════════════════════════════════════════════════════

repos:
  # ─── Базовые fixes ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.1
    hooks:
      - id: trailing-whitespace
        exclude: '^extension/.*\.(min\.js|min\.css)$'
      - id: end-of-file-fixer
        exclude: '^extension/.*\.(min\.js|min\.css)$'
      - id: check-yaml
        # agent.yaml использует многострочные строки — нужны safe
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-toml
      - id: check-json
        # data/profiles/*.json — валидируем
        exclude: '^extension/dist/.*$'
      - id: check-ast
        # проверяем, что .py файлы парсятся Python
      - id: debug-statements
        # запрет print(pdb.set_trace), breakpoint(), import pdb

  # ─── ruff — линтер + форматтер ──────────────────────────────────────
  # Заменяет flake8 + black + isort + pyupgrade в одном инструменте.
  # Конфиг в pyproject.toml или ruff.toml (рекомендуется завести отдельно).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        # --fix — авто-исправление где можно
        # --exit-non-zero-on-fix — fail если что-то пофиксил (чтобы
        #   коммитер увидел изменения и перетейджил)
      - id: ruff-format
        # форматирует код (аналог black)

  # ─── bandit — security-сканер ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-c, .pre-commit/bandit.yaml, -r, src/, scripts/, tests/]
        # -c — конфиг с исключением путей (см. .pre-commit/bandit.yaml)
        # -r — рекурсивно
        # исключаем install.py/setup.py/first_run.py — там print()
        # легитимен и есть # noqa: BLE001 в мастерах

  # ─── pip-audit — проверка зависимостей на уязвимости ───────────────
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.4.20
    hooks:
      # uv работает быстрее pip, но если в окружении только pip — можно
      # заменить на pip-audit напрямую:
      # - repo: https://github.com/pypa/pip-audit
      #   rev: 2.7.5
      #   hooks:
      #     - id: pip-audit
      #       args: [--require-hashes, --strict]
      - id: uv-lock
        # Если используете uv для управления зависимостями — поддерживает
        # lock-файл в актуальном состоянии. Если нет — закомментируйте.

  # ─── Локальные хуки (свои проверки) ─────────────────────────────────
  - repo: local
    hooks:
      # Запрет добавлять НОВЫЕ # noqa — у нас их уже 106, не плодим.
      # Существующие можно оставить (занесены в baseline).
      - id: forbid-new-noqa
        name: Forbidden new '# noqa' comments (use baseline file)
        entry: python scripts/check_no_new_noqa.py
        language: system
        pass_filenames: true
        # baseline — .pre-commit/noqa-baseline.txt (создать через
        # `python scripts/gen_noqa_baseline.py`)

      # Запрет commit'ить с TODO в прод-коде (тесты и dev-скрипты ОК)
      - id: forbid-todo-in-prod
        name: No new TODO/FIXME in production code
        entry: python scripts/check_no_todo.py
        language: system
        files: '^src/'
        exclude: '^src/mcp_servers/(code_analysis|documentation)/.*$'
        # code_analysis MCP сам ищет TODO — там это легитимно

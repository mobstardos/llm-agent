id: fetch
schema_version: "1.5.0"
title: Fetch агент
version: "1.0.0"
description: HTTP fetch с поддержкой markdown-конверсии.

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars: []

mcp_servers: [fetch]
depends_on: {hard: [], soft: []}

priority: 11
routing_hints:
  keywords: [fetch, http, url]
  negative_keywords: []
  description_for_router: |
    HTTP fetch с поддержкой markdown-конверсии.

mode: read
dangerous_tools: []

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🌐", color: "#0a85d6", category: search}


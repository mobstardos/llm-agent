id: slack
schema_version: "1.5.0"
title: Slack агент
version: "1.0.0"
description: "Slack: чтение, отправка сообщений, поиск, управление каналами."

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: SLACK_BOT_TOKEN, level: hard}

mcp_servers: [slack]
depends_on: {hard: [], soft: []}

priority: 8
routing_hints:
  keywords: [slack, слак, канал, сообщение]
  negative_keywords: []
  description_for_router: |
    Slack: чтение, отправка сообщений, поиск, управление каналами.

mode: write
dangerous_tools: [slack_post_message, slack_reply]

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "💬", color: "#4a154b", category: comms}

# GitHub: https://github.com/modelcontextprotocol/servers

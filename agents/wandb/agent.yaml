id: wandb
schema_version: "1.5.0"
title: W&B агент (Weights & Biases official)
version: "1.0.0"
description: Query and analyze your Weights & Biases data через MCP. Official W&B. 16 tools.

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: WANDB_API_KEY, level: hard}

mcp_servers: [wandb]
depends_on: {hard: [], soft: []}

priority: 11
routing_hints:
  keywords: ["wandb", "weights biases", "experiment"]
  negative_keywords: []
  description_for_router: |
    Query and analyze your Weights & Biases data через MCP. Official W&B. 16 tools.

mode: read
dangerous_tools: []

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🏋️", color: "#ffb300", category: ai_obs}

# GitHub (VERIFIED): https://github.com/wandb/wandb-mcp-server

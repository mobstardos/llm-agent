id: datadog
schema_version: "1.5.0"
title: Datadog агент
version: "1.0.0"
description: "Datadog: metrics, traces, logs, RUM, monitors."

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: DATADOG_API_KEY, level: hard}
    - {name: DATADOG_APP_KEY, level: hard}

mcp_servers: [datadog]
depends_on: {hard: [], soft: []}

priority: 10
routing_hints:
  keywords: [datadog, dd, traces, logs]
  negative_keywords: []
  description_for_router: |
    Datadog: metrics, traces, logs, RUM, monitors.

mode: read
dangerous_tools: []

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🐕", color: "#632ca6", category: monitoring}

# GitHub: https://github.com/DataDog/mcp

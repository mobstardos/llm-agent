id: google_drive
schema_version: "1.5.0"
title: Google Drive агент
version: "1.0.0"
description: "Чтение, поиск, загрузка файлов в Google Drive."

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: GDRIVE_CLIENT_ID, level: hard}
    - {name: GDRIVE_CLIENT_SECRET, level: hard}

mcp_servers: [google_drive]
depends_on: {hard: [], soft: []}

priority: 11
routing_hints:
  keywords: [google drive, gdrive, гугл диск]
  negative_keywords: []
  description_for_router: |
    Чтение, поиск, загрузка файлов в Google Drive.

mode: write
dangerous_tools: [gdrive_upload]

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "📁", color: "#4285f4", category: cloud}

# GitHub: https://github.com/modelcontextprotocol/servers

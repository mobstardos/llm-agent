id: argocd
schema_version: "1.5.0"
title: ArgoCD агент (argoproj-labs)
version: "1.0.0"
description: GitOps для Kubernetes через ArgoCD. Official argoproj-labs. Manage apps, sync, deployments.

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: ARGOCD_SERVER, level: hard}
    - {name: ARGOCD_TOKEN, level: hard}

mcp_servers: [argocd]
depends_on: {hard: [], soft: []}

priority: 11
routing_hints:
  keywords: ["argocd", "gitops", "argocd sync"]
  negative_keywords: []
  description_for_router: |
    GitOps для Kubernetes через ArgoCD. Official argoproj-labs. Manage apps, sync, deployments.

mode: destructive
dangerous_tools: ['argocd_sync', 'argocd_create_app']

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🚀", color: "#ef7b4d", category: devops}

# GitHub (VERIFIED): https://github.com/argoproj-labs/mcp-for-argocd

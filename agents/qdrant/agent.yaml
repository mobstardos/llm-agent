id: qdrant
schema_version: "1.5.0"
title: Qdrant агент
version: "1.0.0"
description: "Vector DB. Семантический поиск, гибридный retrieval."

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: QDRANT_URL, level: hard}
    - {name: QDRANT_API_KEY, level: soft}

mcp_servers: [qdrant]
depends_on: {hard: [], soft: []}

priority: 10
routing_hints:
  keywords: [qdrant, vector, вектор, семантика]
  negative_keywords: []
  description_for_router: |
    Vector DB. Семантический поиск, гибридный retrieval.

mode: write
dangerous_tools: [qdrant_upsert, qdrant_create_collection, qdrant_delete_collection]

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🧠", color: "#dc382d", category: database}

# GitHub: https://github.com/qdrant/mcp-server-qdrant

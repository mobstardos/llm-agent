id: sqlite_official
schema_version: "1.5.0"
title: SQLite агент (official)
version: "1.0.0"
description: Управление SQLite-БД через official MCP. Дополнит ваш db_extended.

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: SQLITE_PATH, level: hard}

mcp_servers: [sqlite_official]
depends_on: {hard: [], soft: []}

priority: 11
routing_hints:
  keywords: [sqlite, sqlite3, db]
  negative_keywords: []
  description_for_router: |
    Управление SQLite-БД через official MCP. Дополнит ваш db_extended.

mode: write
dangerous_tools: [sqlite_execute]

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "💾", color: "#003b57", category: database}


id: puppeteer
schema_version: "1.5.0"
title: Puppeteer агент
version: "1.0.0"
description: Puppeteer browser automation. Альтернатива Playwright.

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars: []

mcp_servers: [puppeteer]
depends_on: {hard: [], soft: []}

priority: 9
routing_hints:
  keywords: [puppeteer, chrome, browser]
  negative_keywords: []
  description_for_router: |
    Puppeteer browser automation. Альтернатива Playwright.

mode: write
dangerous_tools: [puppeteer_click, puppeteer_evaluate]

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🎪", color: "#40b99b", category: browser}

# GitHub: https://github.com/modelcontextprotocol/servers

id: figma
schema_version: "1.5.0"
title: Figma агент
version: "1.0.0"
description: "Чтение Figma-файлов: компоненты, переменные, токены дизайна."

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: FIGMA_ACCESS_TOKEN, level: hard}

mcp_servers: [figma]
depends_on: {hard: [], soft: []}

priority: 9
routing_hints:
  keywords: [figma, фигма, дизайн, макет]
  negative_keywords: []
  description_for_router: |
    Чтение Figma-файлов: компоненты, переменные, токены дизайна.

mode: read
dangerous_tools: []

prompt: prompt.md
user_template: user.md

runtime: {max_steps: 15, max_result_chars: 30000, timeout_seconds: 600}
ui: {icon: "🎨", color: "#a259ff", category: design}

# GitHub: https://github.com/figma/figma-mcp

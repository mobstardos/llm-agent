    command: python
    args: ["-m", "src.mcp_servers.journal.server"]

# Лимиты
limits:
  max_agent_steps: 15
  max_tool_result_chars: 30000
  require_confirmation_for:
    # Files
    - write_file
    - apply_patch
    - delete_file
    # DB
    - execute_write_query
    - execute_migration
    # Git
    - git_commit
    - git_push
    - shell_run
    # Browser
    - click
    - fill
    - evaluate
    # 1C Designer
    - load_config
    - update_db
    - restore_ib
    - create_ib
    - build_cf
    - build_cfe
    - build_epf
    # 1C Metadata
    - create_object
    - add_attribute
    - add_tabular_section
    - write_module
    - create_extension
    - adopt_object
    # 1C DCS
    - create_dcs
    - add_calculated_field
    - add_parameter
    # 1C Forms
    - create_form
    - write_form_bsl
    # 1C Tests
    - run_yaxunit
    - run_vanessa
    # Storage
    - upload
    - download
    - delete_object
    - sync_up
    - sync_down
    # LSP
    - lsp_rename
    - lsp_format
    # Migration
    - migration_up
    - migration_down
    - migration_stamp
    # Data
    - csv_to_json
    - csv_to_parquet
    # Kubernetes
    - k8s_exec_pod
    # Journal
    - journal_rollback
    - journal_replay
    - journal_checkpoint_delete
    - journal_retention_enforce

# Логирование
logging:
  level: INFO
  format: json
  sinks:
    console: true
    file_app: true
    file_error: true
    file_audit: true
    sqlite: true
    websocket: true
  retention:
    app_log_mb: 100
    app_log_count: 10
    error_log_mb: 50
    error_log_count: 5
    audit_log_mb: 1024
    audit_log_count: 20
    sqlite_days: 30
    audit_days: 365

# Мониторинг
monitoring:
  health_check_interval_seconds: 30
  tcp_check_timeout_seconds: 5
  com_worker_enabled: true
  com_worker_timeout_seconds: 30

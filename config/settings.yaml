# ═══════════════════════════════════════════════════════════════════════
# Общие настройки
# ═══════════════════════════════════════════════════════════════════════

# Агенты — какие включены по умолчанию
agents:
  enabled_by_default: []
  disabled_by_default: []

# MCP-серверы
mcp_servers:
  filesystem:
    command: python
    args: ["-m", "src.mcp_servers.filesystem.server"]
  mysql:
    command: python
    args: ["-m", "src.mcp_servers.mysql.server"]
  postgres:
    command: python
    args: ["-m", "src.mcp_servers.postgres.server"]
  onec:
    command: python
    args: ["-m", "src.mcp_servers.onec.server"]
  deepseek_web:
    command: python
    args: ["-m", "src.mcp_servers.deepseek.server"]
    env:
      DEEPSEEK_DS_SESSION_ID: "${DEEPSEEK_DS_SESSION_ID}"
      DEEPSEEK_SMIDV2: "${DEEPSEEK_SMIDV2}"
      DEEPSEEK_AUTH_TOKEN: "${DEEPSEEK_AUTH_TOKEN}"
  memory:
    command: python
    args: ["-m", "src.mcp_servers.memory.server"]
  git:
    command: python
    args: ["-m", "src.mcp_servers.git.server"]
  shell:
    command: python
    args: ["-m", "src.mcp_servers.shell.server"]
  document:
    command: python
    args: ["-m", "src.mcp_servers.document.server"]
  image:
    command: python
    args: ["-m", "src.mcp_servers.image.server"]
  browser:
    command: python
    args: ["-m", "src.mcp_servers.browser.server"]
  media:
    command: python
    args: ["-m", "src.mcp_servers.media.server"]
  storage:
    command: python
    args: ["-m", "src.mcp_servers.storage.server"]
  onec_designer:
    command: python
    args: ["-m", "src.mcp_servers.onec_designer.server"]
  onec_metadata:
    command: python
    args: ["-m", "src.mcp_servers.onec_metadata.server"]
  onec_query:
    command: python
    args: ["-m", "src.mcp_servers.onec_query.server"]
  onec_dcs:
    command: python
    args: ["-m", "src.mcp_servers.onec_dcs.server"]
  onec_forms:
    command: python
    args: ["-m", "src.mcp_servers.onec_forms.server"]
  onec_tests:
    command: python
    args: ["-m", "src.mcp_servers.onec_tests.server"]
  code_analysis:
    command: python
    args: ["-m", "src.mcp_servers.code_analysis.server"]
  lsp:
    command: python
    args: ["-m", "src.mcp_servers.lsp.server"]
  testing:
    command: python
    args: ["-m", "src.mcp_servers.testing.server"]
  build:
    command: python
    args: ["-m", "src.mcp_servers.build.server"]
  debug:
    command: python
    args: ["-m", "src.mcp_servers.debug.server"]
  http:
    command: python
    args: ["-m", "src.mcp_servers.http.server"]
  security:
    command: python
    args: ["-m", "src.mcp_servers.security.server"]
  github:
    command: python
    args: ["-m", "src.mcp_servers.github.server"]
  migration:
    command: python
    args: ["-m", "src.mcp_servers.migration.server"]
  db_extended:
    command: python
    args: ["-m", "src.mcp_servers.db_extended.server"]
  documentation:
    command: python
    args: ["-m", "src.mcp_servers.documentation.server"]
  cicd:
    command: python
    args: ["-m", "src.mcp_servers.cicd.server"]
  environment:
    command: python

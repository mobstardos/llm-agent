# ═══════════════════════════════════════════════════════════════════════
# mypy config — llm-agent
# Рекомендация 6 (Sprint 2, P1)
# ═══════════════════════════════════════════════════════════════════════
#
# Запуск: mypy --config-file mypy.ini src/
# В CI: через .github/workflows/typecheck.yml (см. патч)
#
# Стратегия: gradual typing. Сначала включаем strict на подмножестве
# (src/core/, src/loop/, src/journal/), затем расширяем. Для всего
# остального — relaxed режим с предупреждениями.
# ═══════════════════════════════════════════════════════════════════════

[mypy]
# Базовые настройки
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True
show_error_codes = True
show_error_context = True
pretty = true

# Files/модули для которых типизация включена строго
files = src

# Исключения — каталоги и файлы, не проверяемые mypy:
#   - tests/, scripts/test_*.py — тесты, relaxed
#   - install.py/setup.py/first_run.py — CLI-мастера, не критичны
#   - attic/ — legacy-код, не в проде
exclude = (?x)(
    ^tests/
    | ^scripts/test_
    | ^install\.py
    | ^setup\.py
    | ^first_run\.py
    | ^attic/
    | ^build/
    | ^extension/dist/
  )

# Пакеты без type-hints — отключаем import errors для них
[mypy-psycopg.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True


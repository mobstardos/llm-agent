# ─── STRICT — для критичных подсистем ──────────────────────────────────
# После выполнения рекомендации 1 (декомпозиция main.py) добавить сюда
# src/routes/, src/state.py, src/app.py

[mypy-src.core.*]
# Реестр — критичная инфраструктура. Strict режим.
strict = True

[mypy-src.loop.*]
# LoopController — critical для reasoning cycles. Strict.
strict = True

[mypy-src.journal.*]
# Event sourcing — critical для audit log. Strict.
strict = True

[mypy-src.memory.**.base]
strict = True

[mypy-src.memory.**.facade]
strict = True

# ─── RELAXED — для CLI-мастеров и тестов ──────────────────────────────
[mypy-install]
ignore_errors = True

[mypy-setup]
ignore_errors = True

[mypy-first_run]
ignore_errors = True

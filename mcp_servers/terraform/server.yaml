id: terraform
schema_version: "1.5.0"
title: Terraform MCP (HashiCorp official)
description: Управление IaC через Terraform Registry и HCP Terraform APIs. Official HashiCorp.

command: docker
args: ['run', '--rm', '-i', '-e', 'TFC_TOKEN', 'hashicorp/terraform-mcp-server']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: TFC_TOKEN, level: soft}

mode: destructive

tools:
  - {name: tf_plan, danger: read}
  - {name: tf_apply, danger: destructive}
  - {name: tf_destroy, danger: destructive}
  - {name: tf_state_list, danger: read}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Установка: docker pull hashicorp/terraform-mcp-server
# Или скачать binary: https://github.com/hashicorp/terraform-mcp-server/releases

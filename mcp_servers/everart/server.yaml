id: everart
schema_version: "1.5.0"
title: EverArt MCP
description: "Image generation через AI models (DALL-E, Stable Diffusion)."

command: npx
args: ['-y', '@modelcontextprotocol/server-everart']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: EVERART_API_KEY, level: hard}

mode: write

tools:
  - {name: everart_generate, danger: write}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Package: @modelcontextprotocol/server-everart (npm)
# GitHub: https://github.com/modelcontextprotocol/servers
# External — установка через npx/uvx (см. install_mcp_servers.sh)

id: chroma
schema_version: "1.5.0"
title: Chroma MCP
description: Lightweight embedded vector DB для разработки.

command: uvx
args: ['chroma-mcp']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: CHROMA_PATH, level: soft}

mode: write

tools:
  - {name: chroma_query, danger: read}
  - {name: chroma_add, danger: write}
  - {name: chroma_list_collections, danger: read}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Package: chroma-mcp (PyPI)
# GitHub: https://github.com/chroma-core/chroma
# External — установка через npx/uvx (см. install_mcp_servers.sh)

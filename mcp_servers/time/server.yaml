id: time
schema_version: "1.5.0"
title: Time MCP
description: "Текущее время, таймзоны, конверсии."

command: uvx
args: ['mcp-server-time']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars: []

mode: read

tools:
  - {name: time_get, danger: read}
  - {name: time_convert, danger: read}
  - {name: time_list_zones, danger: read}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Package: mcp-server-time (PyPI)
# GitHub: https://github.com/modelcontextprotocol/servers
# External — установка через npx/uvx (см. install_mcp_servers.sh)

id: slack
schema_version: "1.5.0"
title: Slack MCP
description: "Slack: чтение, отправка сообщений, поиск, управление каналами."

command: npx
args: ['-y', '@modelcontextprotocol/server-slack']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: SLACK_BOT_TOKEN, level: hard}

mode: write

tools:
  - {name: slack_list_channels, danger: read}
  - {name: slack_post_message, danger: write}
  - {name: slack_get_messages, danger: read}
  - {name: slack_search, danger: read}
  - {name: slack_reply, danger: write}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Package: @modelcontextprotocol/server-slack (npm)
# GitHub: https://github.com/modelcontextprotocol/servers
# External — установка через npx/uvx (см. install_mcp_servers.sh)

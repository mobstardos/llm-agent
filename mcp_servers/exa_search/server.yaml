id: exa_search
schema_version: "1.5.0"
title: Exa Search MCP
description: "AI-tuned web search — находит статьи, документацию, snippets."

command: python
args: ['-m', 'src.mcp_servers.exa_search.server']

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: EXA_API_KEY, level: hard}

mode: read

tools:
  - {name: exa_search, danger: read}
  - {name: exa_find_similar, danger: read}
  - {name: exa_get_contents, danger: read}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3
  backoff_seconds: [1, 2, 5, 15]

# Package: httpx (в requirements.txt)
# GitHub: https://github.com/exa-labs/exa-mcp-server
# Native Python — реализация в src/mcp_servers/<id>/server.py

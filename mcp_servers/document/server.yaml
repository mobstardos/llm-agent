id: document
schema_version: "1.5.0"
title: Document MCP
description: Работа с документами — PDF, DOCX, XLSX, изображения

command: python
args: ["-m", "src.mcp_servers.document.server"]

requires:
  python_packages:
    - {name: mcp, level: hard}
  env_vars:
    - {name: PROJECT_ROOT, level: hard}

mode: read

tools:
  - {name: read_document, danger: read}
  - {name: extract_tables, danger: read}
  - {name: get_metadata, danger: read}
  - {name: search_in_document, danger: read}
  - {name: list_supported, danger: read}
  - {name: extraction_cache_stats, danger: read}
  - {name: extraction_cache_clear, danger: write}

process:
  startup_timeout_seconds: 30
  restart_policy: on_failure
  max_restarts: 3

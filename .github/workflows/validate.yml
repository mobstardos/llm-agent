name: Validate

on:
  push:
    paths:
      - 'agents/**'
      - 'mcp_servers/**'
      - 'loops/**'
      - 'capabilities/**'
      - 'config/**'
  pull_request:
    paths:
      - 'agents/**'
      - 'mcp_servers/**'
      - 'loops/**'
      - 'capabilities/**'
      - 'config/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pgserver 0.1.4 даёт колёса только до cp312 — на 3.13+ он не установится
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Validate all declarations
        run: python -m src.cli validate

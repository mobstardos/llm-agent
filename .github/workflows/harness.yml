name: Harness

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  harness-smoke:
    name: Harness Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # pgserver 0.1.4 даёт колёса только до cp312 — на 3.13+ он не установится
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate declarations
        run: |
          python -m src.cli validate

      # Жёсткий гейт: file-сценарии (быстрый отказ при регрессии рантайма)
      - name: Harness file scenarios (hard gate)
        run: |
          python -m src.cli harness run file_read_basic --mock-llm --mock-mcp
          python -m src.cli harness run file_apply_patch_basic --mock-llm --mock-mcp

      # Жёсткий гейт: весь smoke-набор (31 сценарий; fixtures детерминированные,
      # генерируются scripts/record_harness_fixtures.py; для замены на записи
      # реального стека — тот же скрипт с --real на машине со стеком)
      - name: Harness smoke suite (hard gate)
        run: python -m src.cli harness tag --tag smoke --mock-llm --mock-mcp

      - name: Harness all categories (hard gate, chaos включительно)
        run: python -m src.cli harness all --mock-llm --mock-mcp

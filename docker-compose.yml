version: "3.9"

# ═══════════════════════════════════════════════════════════════════════
# Инфраструктура: PostgreSQL (pgvector), Apache AGE, Kafka
# ═══════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL основной (pgvector), порт 5432 ────────────────────
  # Схема применяется автоматически при первом старте (initdb.d).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llmagent-postgres
    environment:
      POSTGRES_USER: llmagent
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: llmagent
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/journal.sql:/docker-entrypoint-initdb.d/20-journal.sql:ro
      - ./db/ops.sql:/docker-entrypoint-initdb.d/30-ops.sql:ro
      - ./db/analytics.sql:/docker-entrypoint-initdb.d/40-analytics.sql:ro
      - ./db/search_improvements.sql:/docker-entrypoint-initdb.d/50-search.sql:ro
      - ./db/cdc_notify.sql:/docker-entrypoint-initdb.d/60-cdc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmagent -d llmagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache AGE (отдельная база на порту 5433) ────────────────────
  age-postgres:
    image: apache/age:PG16_latest
    container_name: age-postgres
    environment:
      POSTGRES_USER: llmagent
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: llmagent
    ports:
      - "5433:5432"
    volumes:
      - age_pg_data:/var/lib/postgresql/data
      - ./db/age_schema.sql:/docker-entrypoint-initdb.d/age_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka (KRaft, без ZooKeeper) ─────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Kafka UI (опционально) ───────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  age_pg_data:
  kafka_data:

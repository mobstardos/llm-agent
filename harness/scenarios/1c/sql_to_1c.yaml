id: onec_sql_to_1c
title: 1C Query — конвертация SQL
category: 1c
tags: [smoke, 1c, query, convert]

fixture:
  type: temp_project
  params:
    files:
      "test.txt": "placeholder"

prompt: |
  Сконвертируй SQL в язык запросов 1С:
  SELECT name FROM users WHERE active = TRUE LIMIT 10

options:
